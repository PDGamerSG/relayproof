# Render Blueprint for the hosted RelayProof demo backend: one Docker web
# service running Bifrost with the shadow plugin, the mock upstream and the
# public front door (bifrost-shadow/deploy). The site on Vercel proxies
# /api/shadow/* and /api/demo/* to it.
services:
  - type: web
    name: relayproof-api
    runtime: docker
    # starter: the smallest always-on plan (512 MB, 0.5 CPU). The demo uses
    # about 230 MB. The free plan's 0.1 CPU is too slow for the gateway to boot
    # within Render's start window, and it sleeps when idle.
    plan: starter
    region: virginia
    dockerfilePath: ./bifrost-shadow/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - bifrost-shadow/**
        - render.yaml
        - .dockerignore
      ignoredPaths:
        - bifrost-shadow/site/**
    envVars:
      # The gateway's setup token. Only the front door inside the container
      # uses it; it is never sent to browsers.
      - key: BIFROST_SETUP_TOKEN
        generateValue: true
      # Real Claude models. Set it in the dashboard (Environment); it never goes
      # in this file. Without it the demo runs on the mock upstream.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Requests the demo may send to Claude per UTC day, all kinds together.
      - key: DAILY_REQUESTS
        value: "400"
      - key: CANARY_TTL
        value: 30m
      - key: INCIDENT_TTL
        value: 3m
      # Keeps the Go processes inside the plan's 512 MB.
      - key: GOMEMLIMIT
        value: 320MiB
